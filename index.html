
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  .page-wrap {
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    pointer-events: none;
  }
  .blob-1 { width: 480px; height: 480px; background: #7c3aed; top: -120px; right: -100px; }
  .blob-2 { width: 320px; height: 320px; background: #a78bfa; bottom: -80px; left: -80px; }

  .card {
    background: #fff;
    border: 1px solid #ede9fe;
    border-radius: 20px;
    padding: 3rem 2.5rem;
    max-width: 520px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 32px rgba(124, 58, 237, 0.08);
  }

  .icon-ring {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.75rem;
  }
  .icon-ring svg { width: 34px; height: 34px; }

  .badge {
    display: inline-block;
    background: #ede9fe;
    color: #6d28d9;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 1.25rem;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    color: #1a1a2e;
    margin: 0 0 0.75rem;
    line-height: 1.3;
  }

  .sub {
    font-size: 15px;
    color: #6b7280;
    line-height: 1.7;
    margin: 0 0 2rem;
  }

  .divider {
    border: none;
    border-top: 1px solid #ede9fe;
    margin: 0 0 1.75rem;
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 2rem;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #7c3aed;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .status-text { font-size: 13px; color: #7c3aed; font-weight: 500; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.7); }
  }

  .notify-row {
    display: flex;
    gap: 8px;
  }
  .notify-row input {
    flex: 1;
    padding: 0 14px;
    height: 42px;
    border: 1px solid #ddd6fe;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    color: #1a1a2e;
    outline: none;
    transition: border-color 0.2s;
    background: #faf9ff;
  }
  .notify-row input:focus { border-color: #7c3aed; }
  .notify-row input::placeholder { color: #c4b5fd; }

  .btn {
    height: 42px;
    padding: 0 20px;
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover { background: #6d28d9; }
  .btn:active { transform: scale(0.97); }

  .thanks {
    font-size: 13px;
    color: #7c3aed;
    margin-top: 10px;
    display: none;
  }

  .footer-note {
    margin-top: 2rem;
    font-size: 12px;
    color: #c4b5fd;
    letter-spacing: 0.03em;
  }
</style>

<div class="page-wrap">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="icon-ring">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-.5-13H13v6l5.25 3.15-.75 1.23L11.5 14V7z" fill="#7c3aed"/>
      </svg>
    </div>

    <div class="badge">Scheduled Maintenance</div>
    <h1>We'll be back soon</h1>
    <p class="sub">
      Our site is temporarily unavailable while we make some improvements.
      We're working hard to get everything running smoothly again.
    </p>

    <hr class="divider">

    <div class="status-row">
      <div class="dot"></div>
      <span class="status-text">Maintenance in progress</span>
    </div>
  </div>
</div>

<script>
function notifyMe() {
  const el = document.getElementById('emailInput');
  if (el.value && el.value.includes('@')) {
    document.getElementById('thanks').style.display = 'block';
    el.value = '';
    el.disabled = true;
    document.querySelector('.btn').disabled = true;
    document.querySelector('.btn').style.opacity = '0.5';
  } else {
    el.style.borderColor = '#e11d48';
    setTimeout(() => el.style.borderColor = '#ddd6fe', 1500);
  }
}
</script>
