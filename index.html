<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Maintenance Mode</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:#050816;
    transition:1.4s;
}

body.light{
    background:#fff;
}

.aurora{
    position:fixed;
    inset:-20%;
    filter:blur(120px);
    background:
    radial-gradient(circle at 20% 20%,rgba(139,92,246,.35),transparent 35%),
    radial-gradient(circle at 80% 50%,rgba(255,255,255,.15),transparent 35%);
    animation:spin 20s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}
#mainLogo{
    height:110px;
    animation:
        float 4s ease-in-out infinite,
        glow 2.5s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0)}
    50%{transform:translateY(-15px)}
    100%{transform:translateY(0)}
}

@keyframes glow{
    0%,100%{filter:drop-shadow(0 0 10px #8b5cf6)}
    50%{filter:drop-shadow(0 0 40px #a78bfa)}
}
/* LOGO WRAP CENTER FIX */
.logo-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:40px;
}

/* SAME SIZE FOR BOTH LOGOS */
#mainLogo{
    height:90px;   /* medium size */
    width:auto;
    object-fit:contain;
    transition:opacity .6s ease;
}

.logo-fade{
    opacity:0;
}

/* CONNECTION */
.connection{
    position:relative;
    height:140px;
    max-width:900px;
    margin:auto;
}

.line{
    position:absolute;
    left:15%;
    right:15%;
    top:50%;
    height:4px;
    background:rgba(139,92,246,.3);
    transform:translateY(-50%);
    border-radius:999px;
}

.energy{
    position:absolute;
    height:100%;
    width:120px;
    background:linear-gradient(
        90deg,
        transparent,
        #fff,
        #8b5cf6,
        #fff,
        transparent
    );
    animation:flow 1.8s linear infinite;
}

@keyframes flow{
    from{left:-120px}
    to{left:100%}
}

.plug{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    transition:2.4s cubic-bezier(.17,.84,.44,1);
}

#left{left:8%}
#right{right:8%}

/* CONTACT */
.contact{
    position:fixed;
    left:50%;
    bottom:35px;
    transform:translateX(-50%) translateY(40px);
    opacity:0;
    padding:18px 50px;
    border-radius:999px;
    color:#111;
    font-weight:700;
    text-decoration:none;
    background:linear-gradient(135deg,#8B5CF6,#C4B5FD,#FFF);
    transition:.8s;
    box-shadow:0 10px 40px rgba(139,92,246,.35);
}

.contact.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.content{
    opacity:0;
    transform:translateY(20px);
    transition:1s;
}

.content.show{
    opacity:1;
    transform:none;
}

.flash{
    position:fixed;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
}

.flash.active{
    animation:f .8s;
}

@keyframes f{
    50%{opacity:1}
}

/* MOBILE */
@media (max-width:768px){

    body{overflow-x:hidden;}

    #mainLogo{
        height:65px;
    }

    #title{
        font-size:2.7rem !important;
        line-height:1.1;
    }

    #sub{
        font-size:1rem;
        padding:0 10px;
    }

    .connection{height:100px;}

    .plug svg{
        width:110px;
        height:auto;
    }

    #left{left:2%}
    #right{right:2%}

    .contact{
        width:calc(100% - 32px);
        max-width:320px;
        padding:16px 24px;
        bottom:20px;
        text-align:center;
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="aurora"></div>
<div id="flash" class="flash"></div>

<div class="min-h-screen flex items-center justify-center px-6">

    <div class="text-center w-full max-w-5xl">

        <!-- LOGO CENTERED -->
        <div class="logo-wrap">
            <img id="mainLogo" src="logobefore.png" alt="Company Logo">
        </div>

        <h1 id="title" class="text-white text-5xl md:text-7xl font-black mb-4">
            We're Upgrading
        </h1>

        <p id="sub" class="text-gray-300 text-lg mb-14">
            We are preparing a better experience for you.
        </p>

        <div id="connection" class="connection">

            <div id="line" class="line">
                <div class="energy"></div>
            </div>

            <div id="left" class="plug">
                <svg width="180" height="80">
                    <rect x="40" y="15" width="90" height="50" rx="10"
                    fill="none" stroke="#8B5CF6" stroke-width="4"/>
                    <line x1="130" y1="30" x2="170" y2="30"
                    stroke="#8B5CF6" stroke-width="4"/>
                    <line x1="130" y1="50" x2="170" y2="50"
                    stroke="#8B5CF6" stroke-width="4"/>
                </svg>
            </div>

            <div id="right" class="plug">
                <svg width="180" height="80">
                    <rect x="50" y="15" width="90" height="50" rx="10"
                    fill="none" stroke="#8B5CF6" stroke-width="4"/>
                    <line x1="10" y1="30" x2="50" y2="30"
                    stroke="#8B5CF6" stroke-width="4"/>
                    <line x1="10" y1="50" x2="50" y2="50"
                    stroke="#8B5CF6" stroke-width="4"/>
                </svg>
            </div>

        </div>

        <div id="final" class="content mt-10">
            <h2 class="text-3xl font-bold text-gray-800 mb-3">
                Maintenance In Progress
            </h2>

            <p class="text-gray-600">
                Our team is improving performance, reliability and security.
            </p>
        </div>

    </div>
</div>

<!-- WHATSAPP BUTTON -->
<a
    id="contact"
    class="contact"
    href="https://wa.me/917306201900?text=Hello%20I%20need%20assistance"
    target="_blank"
>
    WhatsApp Us
</a>

<script>
const left = document.getElementById('left');
const right = document.getElementById('right');
const flash = document.getElementById('flash');
const title = document.getElementById('title');
const sub = document.getElementById('sub');
const line = document.getElementById('line');
const final = document.getElementById('final');
const contact = document.getElementById('contact');
const connection = document.getElementById('connection');
const logo = document.getElementById('mainLogo');

setTimeout(() => {
    left.style.left = '38%';
    right.style.right = '38%';
}, 1000);

setTimeout(() => {

    flash.classList.add('active');

    logo.classList.add('logo-fade');

    setTimeout(() => {
        logo.src = 'logoafter.png';
        logo.onload = () => {
            logo.classList.remove('logo-fade');
        };
    }, 300);

    document.body.classList.add('light');

    title.classList.remove('text-white');
    title.classList.add('text-gray-900');

    sub.classList.remove('text-gray-300');
    sub.classList.add('text-gray-600');

    left.style.opacity = '0';
    right.style.opacity = '0';
    line.style.opacity = '0';

    setTimeout(() => {
        connection.remove();
        final.classList.add('show');
        contact.classList.add('show');
    }, 700);

}, 3800);
</script>

</body>
</html>
