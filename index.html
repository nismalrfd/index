<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        /* Color variables for easy tweaking */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e1b4b;
            --text-secondary: #64748b;
            --violet: #7c3aed;
            --violet-light: #ede9fe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--bg-card);
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.08), 
                        0 8px 10px -6px rgba(124, 58, 237, 0.05);
            border: 1px solid rgba(124, 58, 237, 0.1);
        }

        /* Gentle pulse animation for the icon */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .icon-wrapper {
            background-color: var(--violet-light);
            color: var(--violet);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            animation: pulse 3s ease-in-out infinite;
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 12px 0;
            letter-spacing: -0.025em;
        }

        p {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-wrapper">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A1.5 1.5 0 1019.5 18.75l-5.83-5.83M11.42 15.17l2.43-2.43M11.42 15.17L7.5 21.5l-3.58-3.58L10.25 14M13.85 12.75l-4.1-4.1m4.1 4.1L21 6.75A1.5 1.5 0 0018.75 4.5l-5.83 5.83m-3.22-1.34l-2.43-2.43m2.43 2.43L3.5 3.5l3.58 3.58L11 4.25"></path>
            </svg>
        </div>
        
        <h1>Under Maintenance</h1>
        <p>We are currently updating our systems to improve your experience. We will be back online shortly!</p>
    </div>

</body>
</html>
